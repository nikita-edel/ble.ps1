name: ci

on:
  push:
    # skipped when a push changes only these files (docs, wiki, notes)
    paths-ignore: &no-tests
      - '**.txt'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *no-tests

# a newer push to the same branch stops the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      # the end-to-end tests (./build.ps1 -E2E) run locally only: they fail on GitHub's Windows runners
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ble
          path: out/ble
