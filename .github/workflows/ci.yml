name: ci

on:
  push:
    # branches only: a tag push doesn't build again (releases: release.yml, started by hand)
    branches: ['**']
    # skipped when a push changes only these files (docs, wiki, notes)
    paths-ignore: &no-tests
      - '**.txt'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *no-tests

# a newer push to the same branch stops the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      # the end-to-end tests (./build.ps1 -E2E) run locally only: they fail on GitHub's Windows runners
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: ble
          path: out/ble
